version: '3.8'

services:
  database:
    image: mongo:6.0
    container_name: maris-mongodb
    ports:
      - "27017:27017"
    volumes:
      - maris-db-data:/data/db
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maris-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://database:27017/maris
      - JWT_SECRET=super_secret_jwt_sign_key_change_in_production
      - JWT_EXPIRES_IN=1d
      - LOG_LEVEL=info
    depends_on:
      - database
    restart: on-failure

  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: maris-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - maris-minio-data:/data
    restart: always

volumes:
  maris-db-data:
  maris-minio-data:
